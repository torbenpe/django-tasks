[project]
name = "django-tasks"
version = "0.2.0"
description = "Django-Kachel, die die offenen Tasks des lokalen Taskwarrior anzeigt"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["django>=5.2"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "tasks"
